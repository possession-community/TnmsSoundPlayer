name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  cicd:
    uses: possession-community/modsharp-publish-action/.github/workflows/deploy.yml@v2
    with:
      # TnmsSoundPlayerTest is a manual harness, so it is deliberately not shipped.
      projects: TnmsSoundPlayer
      shared-projects-phase1: TnmsSoundPlayer.Shared

      platforms: linux-x64 win-x64

      main-artifact-name: TnmsSoundPlayer
      main-artifact-include: modules shared

      # Checked during CI; the push itself is the job below.
      nuget-project-dirs: TnmsSoundPlayer.Shared

  # Declared here rather than inside the reusable workflow because nuget.org validates the OIDC
  # token's job_workflow_ref against the repository that owns the package, and that claim names the
  # workflow file the job lives in. A sibling of release, not a dependency of it: a NuGet failure
  # should not withhold the GitHub release.
  publish-nuget:
    needs: cicd
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: possession-community/modsharp-publish-action/nuget-publish@v2
        with:
          project-dirs: TnmsSoundPlayer.Shared
          user: ${{ secrets.NUGET_USER }}

  release:
    needs: cicd
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts/
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.zip
